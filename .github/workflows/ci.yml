name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pinned rather than `latest` so a bun release cannot change what CI runs
      # between two pushes of the same commit. Matches the local toolchain.
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      # The root typecheck covers src and test only. tools/exam is reached by
      # neither, and nothing there is bundled by the build, so without this step
      # its compile-time guards would be unenforced.
      - name: Typecheck tools
        run: bun run typecheck:tools

      - name: Test
        run: bun run test

      # The extractor is its own bun package with its own lockfile and tsconfig,
      # so neither the root install, the root typecheck nor the vitest suite
      # reaches it. Its suite rebuilds the pack in memory and asserts the shape
      # the app loads, which is the only guard on an upstream-data regression.
      - name: Install extractor dependencies
        run: bun install --frozen-lockfile --cwd tools/extractor

      - name: Test extractor
        run: bun test tools/extractor/src/extract.test.ts

      - name: Typecheck extractor
        run: bun x tsc --noEmit -p tools/extractor/tsconfig.json

      # STC_COMMIT stamps the build with the commit it was made from, which the
      # deployed page then serves as <meta name="stc-commit"> and hands to the
      # render exam. A pull request build checks out a synthetic merge commit,
      # so the head sha is the one worth naming.
      - name: Build
        run: bun run build
        env:
          STC_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 1
          if-no-files-found: error

  deploy:
    name: Deploy to Cloudflare Pages
    needs: build
    runs-on: ubuntu-latest
    # Deploy pushes and same-repo PRs (fork PRs lack secrets) to the stc-preview
    # project, giving each branch its own preview domain. The production stc
    # project stays reserved for manual deploys.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=stc-preview --branch=${{ github.head_ref || github.ref_name }}
